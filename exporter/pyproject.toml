[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-exporter"
version = "0.1.0"
description = "Docker-first mail export utility"
requires-python = ">=3.13"
dependencies = ["dnspython>=2.7,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
